table inet wgfw
flush table inet wgfw

table inet wgfw {
    chain forward {
        type filter hook forward priority 0; policy drop;

        ct state established,related accept

        # IT: повний доступ до corp-lan
        iifname "wg0" oifname "enp0s8" ip saddr 10.200.30.0/24 accept

        # Бухгалтерія: лише портал бухгалтерії
        iifname "wg0" oifname "enp0s8" ip saddr 10.200.10.0/24 ip daddr 192.168.100.10 tcp dport 8081 accept

        # Менеджмент: лише портал менеджменту
        iifname "wg0" oifname "enp0s8" ip saddr 10.200.20.0/24 ip daddr 192.168.100.10 tcp dport 8082 accept

        # Решта блокується з журналюванням
        limit rate 10/second log prefix "WG-DROP " counter drop
    }
}
